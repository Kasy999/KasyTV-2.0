# Baut die PWA bei jedem Push auf main (und alle 6 h für den EPG-Spiegel) und veröffentlicht sie auf GitHub Pages.
# Einmalig im Repository: Settings → Pages → Source: "GitHub Actions".
name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *' # EPG-Spiegel alle 6 Stunden aktualisieren
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Mirror free EPG (XMLTV) into the site
        run: node scripts/fetch-epg.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
